{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Make a reservation</h1>
    <!--Begin row-->
    <div class="row">
      <!--Begin col-->
      <div class="column">
          {% csrf_token %}
          <form method="POST" id="form">
            <!-- {% csrf_token %} -->
            <p>
              <label for="first_name">Name:</label>
              <input type="text" placeholder="Your Name" maxlength="200" required="" id="first_name">
            </p>
            <p>
            <!-- Step 9: Part one -->
            <label for="reservation_date">Date:</label>
            <input type="text" placeholder="Your reservation" maxlength="200" required="" id="reservation_date">
          </p>
            </p>
      
            <p>
              <label for="reservation_slot">Reservation time:</label>
              <select id="reservation_slot">
                <option value="0" disabled>Select time</option>
              </select>
            </p>
            <button type="button" id="button">Reserve</button>
          </form>
      </div>
      <!--End col-->

      <!--Begin col-->
      <div class="column">
        <h2>Bookings For <span id="today"></span></h2>
        <div id="bookings">
        </div>
      </div>
      <!--End col-->
    </div>
    <!--End row-->




  </article>
</section>
<script>
  function onPageLoad() {
    console.log("Page has loaded!");
  const date = new Date()
  document.getElementById('reservation_date').value = `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate().toString().padStart(2, "0")}`
  console.log("hello world");
  console.log(document.getElementById('reservation_date').value)
  getBookings()
  }

  /*  Step 10: Part two */
  document.getElementById('reservation_date').addEventListener('change', function() {getBookings()});


  function getBookings() {
    let reserved_slots = []
    const date = document.getElementById('reservation_date').value
    document.getElementById('today').innerHTML = date
    
    fetch("{% url 'bookings' %}" + '?date=' + date)
      .then(r => r.json())
      .then(data => {
        reserved_slots = []
        bookings = ''
        
        /* Step 11: Part three */
        const data = [item];
        let reserved_slots = [];
        let bookings = ''; 
        
        for (let item of data) {
    // Call a log() function over the console and pass item.fields as an argument
    console.log(item.fields);

    // Call a push() function over reserved_slots array and pass item.fields.reservation_slot to it
    reserved_slots.push(item.fields.reservation_slot);

    // Update the bookings string variable
    bookings += `<p>${item.fields.first_name} - ${formatTime(item.fields.reservation_slot)}</p>`;
}
        
        /* Step 12: Part four  */

    let slot_options = '<option value="0" disabled>Select time</option>';

    for (let i = 11; i < 20; i++) {
    // Create a constant called label and assign the result of formatTime(i)
    const label = formatTime(i);
    console.log("reservedslots",reserved_slots.includes(i),i);  
    // Check if the current number (i) is in the reserved_slots array
    if (reserved_slots.includes(i)) {
        // If reserved, add a disabled option
        slot_options += `<option value="${i}" disabled>${label}</option>`;
    } else {
        // If not reserved, add an enabled option
        slot_options += `<option value="${i}">${label}</option>`;
    }
}

// Update the dropdown with the generated options
        document.getElementById('reservation_slot').innerHTML = slot_options;

        document.getElementById('reservation_slot').innerHTML = slot_options
        if(bookings==''){
          bookings = "No bookings"
        }
        document.getElementById('bookings').innerHTML = bookings
      })
  }

  function formatTime(time) {
    const ampm = time < 12 ? 'AM' : 'PM'
    const t = time < 12 ? time : time > 12 ? time - 12 : time
    const label = `${t} ${ampm}`
    return label
  }


  document.getElementById('button').addEventListener('click', function (e) {
    const formdata = {
      first_name: document.getElementById('first_name').value,
      reservation_date: document.getElementById('reservation_date').value,
      reservation_slot: document.getElementById('reservation_slot').value,
    }

    fetch("{% url 'bookings' %}", { method: 'post', body: JSON.stringify(formdata) })
      .then(r => r.text())
      .then(data => {
        getBookings()
      })
  })
</script>
{% endblock %}
